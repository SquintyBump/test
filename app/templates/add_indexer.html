{% extends "base.html" %}

{% block content %}
    <h1>Add a New Indexer</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.name.label }}<br>
            {{ form.name(size=32) }}
        </p>
        <p>
            {{ form.url.label }}<br>
            {{ form.url(size=64) }}
        </p>
        <p>
            {{ form.api_key.label }}<br>
            {{ form.api_key(size=64) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
