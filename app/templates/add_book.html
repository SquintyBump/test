{% extends "base.html" %}

{% block content %}
    <h1>Add a New Book</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.title.label }}<br>
            {{ form.title(size=32) }}
        </p>
        <p>
            {{ form.author.label }}<br>
            {{ form.author(size=32) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
{% endblock %}
