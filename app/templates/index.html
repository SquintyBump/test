<!doctype html>
<html>
    <head>
        <title>{{ title }} - Readarr</title>
    </head>
    <body>
        <h1>Tracked Books</h1>
        <p><a href="{{ url_for('add_book') }}">Add a new book</a></p>
        <p><a href="{{ url_for('indexers') }}">Manage Indexers</a></p>
        <p><a href="{{ url_for('search') }}">Search for a book</a></p>
        <table>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
            </tr>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.status }}</td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
